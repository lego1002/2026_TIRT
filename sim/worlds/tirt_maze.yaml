# 2026 TIRT 迷宮機器人挑戰賽 —— 場地模型(暫定牆面配置)
#
# ★★ 牆面配置是「猜的」,尺寸才是規則裡的真值 ★★
#
#   規則四.3 寫明「迷宮之場地路徑圖,主辦單位會先行提供予參賽隊伍」。
#   拿到那張圖之後,回來把下面的 maze: 區塊照著重畫一次就好 —— 尺寸、
#   起點/終點/中繼點的定義都不用動。這正是把場地寫成 ASCII 的理由:
#   賽前拿到圖的當下,五分鐘就能把模擬場地換成真的。
#
# 依規則四(賽道及道具說明)填入的真值:
#   * 迷宮由 9x9 方塊組成,每方塊內尺寸 44cm(外尺寸 46x46,牆高 20cm)
#     -> cell: 0.44, wall: 0.02,格心間距 46cm,整體 9*0.46+0.02 = 4.16m
#   * 迷宮結構為 1cm 方形鋁條 + 金屬連接件,牆面白色不透光
#     -> 對光達來說是良好的反射面,但白色高反射偶爾會有無回波(見 dropout_prob)
#   * 障礙物 25x25x20cm,由裁判在**正式比賽前**放進障礙區
#     -> 也就是說你掃地圖的時候障礙物已經在場上了,會被掃進地圖裡
#   * 路線:起始區 -> 迷宮區 -> 中繼區 -> 障礙區 -> 終點
#     規則五.2:沒通過中繼區就抵達終點 = 該輪失敗,所以中繼點是必經的
#
# 場地全圖 528cm 寬,迷宮本體 416cm —— 這裡只模型化迷宮本體,
# 周邊的計時器感應開關等不影響導航,略過。
name: TIRT 2026 迷宮(暫定配置)

cell: 0.44
wall: 0.02
resolution: 0.02
origin: [0.0, 0.0]

# 上半(第 0~2 列)刻意留空 = 障礙區,障礙物由下面的 obstacles: 放進去。
# 下半(第 3~8 列)是迷宮區。兩區之間只有一個開口(第 5 行的缺口)= 中繼區。
maze: |
  +--+--+--+--+--+--+--+--+--+
  |                          |
  +  +  +  +  +  +  +  +  +  +
  |                          |
  +  +  +  +  +  +  +  +  +  +
  |                          |
  +--+--+--+--+--+  +--+--+--+
  |        |        |        |
  +  +--+  +  +--+  +--+--+  +
  |  |     |  |     |     |  |
  +  +  +--+  +  +--+  +  +  +
  |  |  |     |  |     |  |  |
  +  +  +  +--+  +--+--+  +  +
  |     |     |           |  |
  +--+--+  +--+--+--+--+  +  +
  |        |           |     |
  +  +--+--+  +--+--+  +--+  +
  |           |        |     |
  +--+--+--+--+--+--+--+--+--+

# 障礙物:[中心x, 中心y, 寬, 高](公尺)。規則的 25x25cm。
# 位置是隨便放的 —— 比賽當天是裁判臨場放,所以這裡的重點不是位置對不對,
# 而是「地圖裡有障礙物」這件事會怎麼影響 Nav2 的路徑規劃。
obstacles:
  - [1.20, 3.30, 0.25, 0.25]
  - [2.60, 3.70, 0.25, 0.25]
  - [3.20, 2.90, 0.25, 0.25]

# 起點:左下角那一格,車頭朝右(+x)。規則:機器人由起始區內出發。
start: cell 8,0,0

# 中繼區:迷宮區通往障礙區的唯一開口(第 5 列第 5 行的缺口下方)。
# 規則五.2 —— 沒經過這裡就到終點視為失敗,所以自動化流程要把它當強制途經點。
checkpoint: cell 3,5

# 終點:右上角。
goal: cell 0,8
