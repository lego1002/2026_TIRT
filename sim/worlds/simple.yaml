# 3x3 小場地 —— 開發/除錯用,不是比賽場地。
#
# 用途:改完模擬器程式碼想馬上看它有沒有動、或是想在 10 秒內重現一個故障時用。
# 9x9 的正式場地光是開一圈就要好幾分鐘,拿來 debug 太慢。
name: 簡單 3x3 測試場

cell: 0.44          # 每格淨寬(m)—— 和規則一致,這樣車體/牆的比例是真的
wall: 0.02          # 牆厚(m)
resolution: 0.02    # 模擬柵格解析度(m)。比地圖的 5cm 細,光線追蹤才準
origin: [0.0, 0.0]  # 迷宮左下角在世界座標的位置

# ASCII 迷宮畫法:
#   奇數列(0,2,4...)是橫牆列,'--' = 有牆,'  ' = 通
#   偶數列(1,3,5...)是格子列,'|'  = 有牆,' '  = 通
#   每格佔 3 個字元寬。W 格寬的圖 = 3W+1 字元,H 列高的圖 = 2H+1 列。
maze: |
  +--+--+--+
  |        |
  +  +--+  +
  |  |     |
  +  +  +--+
  |  |     |
  +--+--+--+

# 車子起始位姿。'cell r,c[,yaw度]' 用格號(左上角是 0,0,和上圖看到的一樣),
# 也可以直接寫 [x, y, yaw度] 的世界座標。
start: cell 2,0,0

goal: cell 0,2
