# TIRT 雙機定址常數 —— 這是整套架構的單一真相來源。
#
# 為什麼要有「固定第二 IP」:
#   換場地就換一個 DHCP IP,以前每次都要先想辦法查出 Pi 拿到什麼 IP,再手打
#   DDS_SERVER=<pi_ip> ./run_slam.sh。這裡改成兩台各自在無線介面上「多掛」一個
#   永遠不變的靜態別名,DHCP 位址照拿(上網 / tailscale 照常用),而機器人之間
#   一律只用這組常數溝通。於是 ssh 目標、DDS discovery server 位址全部寫死,
#   換任何網路都不必改任何設定,也完全不依賴 multicast / mDNS
#   (2026-07-24 實測場地 AP 不轉發 client 間 multicast,mDNS 會一起陣亡)。
#
# 唯一的前提:AP 必須肯轉發 client 之間的 unicast(一般家用路由器 / 手機熱點都會)。
# 若場地 AP 開了 client isolation,連 ping 都不通,固定 IP 也救不了 —— 那時請改用
# networkplan.md 的自帶熱點方案(這正是把手機熱點寫進 netplan 的理由)。
#
# 想換網段(例如場地 DHCP 剛好也發 10.77.0.x)只要改這裡,然後同步改
# dds/fastdds_pi.xml 與 dds/fastdds_pc.xml 裡的位址(XML 沒辦法讀 shell 變數)。

# 每一項都寫成 ${VAR:-預設},所以臨時要改可以用環境變數蓋過去而不必動檔案,例如
#   TIRT_PI_IP=192.168.50.9 ./robotctl status     # 暫時走 DHCP 位址除錯
# 長期要改(例如場地 DHCP 撞號)還是直接改這裡的預設值。

TIRT_PI_IP=${TIRT_PI_IP:-10.77.0.2}
TIRT_PC_IP=${TIRT_PC_IP:-10.77.0.1}
TIRT_PREFIX=${TIRT_PREFIX:-24}

# ssh 帳號與 Pi 上的 repo 路徑(robotctl / gcs.sh 用來連 Pi)
TIRT_SSH_USER=${TIRT_SSH_USER:-lego}
TIRT_PI_REPO=${TIRT_PI_REPO:-/home/lego/2026_TIRT}

# Fast DDS Discovery Server(跑在 Pi 上)
TIRT_DDS_PORT=${TIRT_DDS_PORT:-11811}

# Pi 端 tmux session 名稱
TIRT_PI_SESSION=${TIRT_PI_SESSION:-tirt}
